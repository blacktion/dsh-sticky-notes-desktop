<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sticky notes">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c" />
      <stop offset="1" stop-color="#1c1c1e" />
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a5a5e" />
      <stop offset="1" stop-color="#2c2c2e" />
    </linearGradient>
  </defs>

  <!-- The note itself: dark by default, matching the plugin's out-of-the-box appearance. -->
  <rect x="8" y="8" width="44" height="44" rx="7" fill="url(#paper)" stroke="#6e6e73" stroke-width="2" />

  <!-- The peeled corner, which is what makes it read as a sticky note rather than a card. -->
  <path d="M52 38 L52 45 a7 7 0 0 1 -7 7 L38 52 Z" fill="url(#fold)" stroke="#6e6e73" stroke-width="2" stroke-linejoin="round" />

  <!-- Text lines. -->
  <g stroke="#f5f5f5" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="18" y1="24" x2="42" y2="24" />
    <line x1="18" y1="33" x2="36" y2="33" />
  </g>

  <!-- Alarm badge: this plugin also does 便签闹钟. -->
  <circle cx="47" cy="17" r="10" fill="#ffb020" stroke="#1c1c1e" stroke-width="2" />
  <g stroke="#1c1c1e" stroke-width="2.4" stroke-linecap="round">
    <line x1="47" y1="11.5" x2="47" y2="17" />
    <line x1="47" y1="17" x2="51" y2="19.5" />
  </g>
</svg>
